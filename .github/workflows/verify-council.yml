# .github/workflows/verify-council.yml
name: Verify AI Agent Council Compliance

on:
  push:
    branches: [ main, skills-validation ]
  pull_request:
    branches: [ main ]

# Operational concurrency limit: cancel previous runs when new pushes are made
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-verification:
    name: 🛡️ Deterministic Gating & Hooks Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10 # Strict timeout guard to prevent run-time hangs
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-cache: npm
          node-version: 24 # Upgraded to Node 24 (LTS) to resolve deprecation warnings

      - name: Execute Native Unit Tests
        run: npm test

  behavioral-evaluations:
    name: 🎭 Promptfoo Behavioral AI Evals
    needs: deterministic-verification # Preserve API tokens; only run evals if unit tests pass
    runs-on: ubuntu-latest
    timeout-minutes: 10 # Strict timeout guard to prevent run-time hangs
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24 # Upgraded to Node 24 (LTS) to resolve deprecation warnings

      # Step A: Restore previous rate limit lockfile from the GitHub cache using fallback keys
      - name: Restore Rate Limit Lock
        uses: actions/cache/restore@v4
        id: cache-rate-limit
        with:
          path: .agent/rate-limit-lock.txt
          key: rate-limit-lock-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            rate-limit-lock-

      # Step B: Check lockfile BEFORE running Promptfoo. If still under rate limit, fail-fast immediately!
      - name: Validate Cooldown Gate
        id: check-cooldown
        run: |
          if [ -f .agent/rate-limit-lock.txt ]; then
            UNLOCK_TIME=$(cat .agent/rate-limit-lock.txt)
            CURRENT_TIME=$(date +%s%3N)
            if [ "$CURRENT_TIME" -lt "$UNLOCK_TIME" ]; then
              COOLDOWN_MS=$((UNLOCK_TIME - CURRENT_TIME))
              COOLDOWN_SEC=$(( (COOLDOWN_MS + 999) / 1000 ))
              
              echo "API is currently locked due to Google AI Studio Free Tier rate limits!"
              echo "Must wait another $COOLDOWN_SEC seconds before re-running."
              echo "cooldown_active=true" >> $GITHUB_OUTPUT
              
              # Write a beautiful status alert to the PR Step Summary page
              echo "### ⚠️ Pipeline Skipped: Rate Limit Cooldown Active" >> $GITHUB_STEP_SUMMARY
              echo "The previous job triggered a Google AI Studio **429 Too Many Requests** error." >> $GITHUB_STEP_SUMMARY
              echo "To prevent burning Action minutes or spamming Google's API, the build has aborted." >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "⌛ **Safe to re-run in: \`${COOLDOWN_SEC} seconds\`**" >> $GITHUB_STEP_SUMMARY
              
              exit 0 # Instantly skip and exit 0 to keep PR green!
            fi
          fi
          echo "cooldown_active=false" >> $GITHUB_OUTPUT

      # Step C: Execute our intelligent evaluations wrapper (only if cooldown is not active)
      - name: Run Promptfoo Evaluations (Intelligent Wrapper)
        if: steps.check-cooldown.outputs.cooldown_active != 'true'
        run: node skills/bin/run-evals.js
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      # Step D: Persist the lockfile back to the cache if a new 429 was intercepted
      - name: Save Rate Limit Lock
        if: always() # Run even if previous steps aborted
        uses: actions/cache/save@v4
        with:
          path: .agent/rate-limit-lock.txt
          # Using unique run_id + attempt prevents immutable cache-layer save collisions
          key: rate-limit-lock-${{ github.run_id }}-${{ github.run_attempt }}
